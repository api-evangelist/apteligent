name: Apteligent
description: 'Apteligent (originally Crittercism, founded 2011 by Andrew Levy, Robert Kwok, and Jeeyun
  Kim, rebranded to Apteligent in 2016) was a mobile application performance management platform that
  provided real-time crash reporting, diagnostics, service monitoring, and user-engagement analytics
  across iOS, Android, hybrid, and HTML5 apps. Backed by GV (Google Ventures), Opus Capital, and Shasta
  Ventures (~$48.7M raised), the company was acquired by VMware on 2017-05-15 and folded into the Workspace
  ONE digital-workspace platform. Following VMware''s 2024 end-user-computing spin-off, the technology now
  ships under the Omnissa Intelligence brand. The independent Apteligent developer surface has been retired:
  apteligent.com no longer resolves at the apex and www.apteligent.com 301-redirects to omnissa.com; there
  is no live standalone API, documentation, or developer portal to enrich.'
